name: Build Android (Unity 6)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish the APK as a GitHub pre-release (test build)'
        type: boolean
        default: false

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The Unity license is a secret. Without it this job FAILS on purpose, so a missing license is never mistaken for a green build.
  check-secrets:
    name: Check Unity license secrets (fails if missing)
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          if [ -z "$UNITY_LICENSE" ]; then
            echo "::error title=Falta el secreto UNITY_LICENSE::No se puede compilar sin licencia de Unity. Crea los secretos UNITY_LICENSE, UNITY_EMAIL y UNITY_PASSWORD (README > CI)."
            exit 1
          fi
          if [ -z "$UNITY_EMAIL" ] || [ -z "$UNITY_PASSWORD" ]; then
            echo "::error title=Faltan UNITY_EMAIL / UNITY_PASSWORD::game-ci los necesita junto con UNITY_LICENSE."
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

  test:
    name: EditMode tests
    needs: check-secrets
    if: needs.check-secrets.outputs.ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-test-${{ hashFiles('Packages/manifest.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: Library-test-
      - uses: game-ci/unity-test-runner@v4
        id: tests
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          testMode: editmode
          projectPath: .
          unityVersion: auto
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: EditMode test results
          artifactsPath: test-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results

  build:
    name: Android APK
    needs: [ check-secrets, test ]
    # The APK is built even if a test fails, so a build is always obtainable; the test job still reports its own result.
    if: ${{ !cancelled() && needs.check-secrets.outputs.ready == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          swap-storage: true
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Packages/manifest.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: Library-Android-
      - name: Compute version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF#refs/tags/v}"
          else
            V="0.1.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: auto
          targetPlatform: Android
          androidExportType: androidPackage
          buildMethod: CloudGarden.EditorTools.BuildScript.BuildAndroid
          buildName: CloudGardenTycoon
          versioning: Custom
          version: ${{ steps.ver.outputs.version }}
          androidVersionCode: ${{ github.run_number }}
          allowDirtyBuild: true
      - name: Upload Unity log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unity-build-log
          path: |
            build/**/*.log
            *.log
          if-no-files-found: ignore
      - name: Verify APK
        run: |
          set -e
          APK=$(ls build/Android/*.apk | head -n 1)
          test -s "$APK"
          ls -l "$APK"
          unzip -l "$APK" | grep -q "AndroidManifest.xml"
          sha256sum "$APK" | tee build/Android/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: CloudGardenTycoon-apk
          path: |
            build/Android/*.apk
            build/Android/SHA256SUMS.txt
          retention-days: 30

  release:
    name: GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release == true)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: CloudGardenTycoon-apk
          path: dist
      - name: Rename APK with the version
        run: |
          mv dist/CloudGardenTycoon.apk "dist/CloudGardenTycoon-${{ needs.build.outputs.version }}.apk"
          ls -l dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('test-{0}', github.run_number) }}
          name: Cloud Garden Tycoon ${{ needs.build.outputs.version }}${{ startsWith(github.ref, 'refs/tags/v') && '' || ' (test build)' }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          body: |
            Installable Android APK (debug-signed, `com.julianfarks.cloudgardentycoon`).
            Enable "Install unknown apps" on your phone, download the `.apk` below and open it.
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt
